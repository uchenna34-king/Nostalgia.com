<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(25 .5 .5)">
      <stop offset="0" stop-color="#3A4A44"/>
      <stop offset="1" stop-color="#02120c"/>
    </linearGradient>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#g)"/>
  <rect width="900" height="1200" filter="url(#n)" opacity="0.5"/>
  <circle cx="450" cy="470" r="215" fill="none" stroke="#E8DFCF" stroke-width="1.5" opacity="0.5"/>
  <text x="450" y="1080" font-family="Georgia, serif" font-size="64" font-weight="700"
    fill="#E8DFCF" text-anchor="middle" letter-spacing="4">BOMBER</text>
  <text x="450" y="1130" font-family="Helvetica, Arial, sans-serif" font-size="20"
    fill="#E8DFCF" text-anchor="middle" letter-spacing="8" opacity="0.7">NOSTALGIA</text>
</svg>